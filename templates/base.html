<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
<title>CKD Kidney Stage Navigator</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap 5 CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

    <!-- Google font -->
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-dark text-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-gradient-primary shadow-sm sticky-top">
  <div class="container py-2">
    <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="{{ url_for('single_slice') }}">
      <span class="logo-dot"></span> CKD Stage Navigator
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="mainNav">
      <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
        <li class="nav-item">
          <a class="nav-link {% if request.path.startswith('/slice') %}active{% endif %}"
             href="{{ url_for('single_slice') }}">Single Slice</a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.path.startswith('/case') %}active{% endif %}"
             href="{{ url_for('whole_case') }}">Whole Case</a>
        </li>
        <li class="nav-item">
          <button class="btn btn-outline-light btn-sm ms-lg-2" id="toggle-theme">Glow</button>
        </li>
      </ul>
    </div>
  </div>
</nav>

<main class="py-4">
  <div class="container">
    {% block content %}{% endblock %}
  </div>
</main>

<footer class="footer text-center small mt-5 mb-3">
  Kidney stage navigation powered by segmentation + EfficientNet. Designed for rapid visual triage.
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  // Light JS polish: theme pulse + copy summary buttons
  document.addEventListener("DOMContentLoaded", () => {
    const root = document.documentElement;
    const toggle = document.getElementById("toggle-theme");
    if (toggle) {
      toggle.addEventListener("click", () => {
        root.classList.toggle("theme-glow");
        toggle.innerText = root.classList.contains("theme-glow") ? "Calm" : "Glow";
      });
    }

    document.querySelectorAll("[data-copy-target]").forEach(btn => {
      btn.addEventListener("click", () => {
        const target = document.querySelector(btn.dataset.copyTarget);
        if (target) {
          const textToCopy = target.innerText || target.textContent;
          navigator.clipboard.writeText(textToCopy).then(() => {
            const originalText = btn.innerText;
            btn.classList.add("btn-success");
            btn.innerText = "✓ Copied";
            setTimeout(() => {
              btn.classList.remove("btn-success");
              btn.innerText = originalText;
            }, 2000);
          }).catch(() => {
            btn.innerText = "Failed";
            setTimeout(() => {
              btn.innerText = "Copy note";
            }, 1500);
          });
        }
      });
    });
    
    // Add fade-in animation to content on load
    document.addEventListener("DOMContentLoaded", () => {
      const content = document.querySelector("main .container");
      if (content) {
        content.classList.add("fade-in");
      }
    });
  });
</script>
</body>
</html>
